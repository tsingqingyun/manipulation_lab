[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "manipulation-learning-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Real demonstration learning and reproducible PickPlaceCan teaching lab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
